name: Daily Stock Radar

on:
  schedule:
    # 한국 시간 아침 07:00 = UTC 22:00 (전날 밤 10시)
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # 수동 즉시 실행 버튼

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance requests

      - name: Run Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python radar_bot.py
